# HTTPS-enabled Nginx configuration for Cutlist Optimizer Production Environment

upstream cutlist_optimizerapp {
    server cutopt_app_prod:8080;
}

server {
    listen 80;
    server_name cutopt.nath-server.home;

    # Redirect all plain HTTP traffic to HTTPS.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cutopt.nath-server.home;

    ssl_certificate /etc/nginx/ssl/cutopt-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/cutopt-selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Logging
    access_log /var/log/nginx/cutlist_optimizerprod_access.log;
    error_log /var/log/nginx/cutlist_optimizerprod_error.log;

    # Main application
    location / {
        proxy_pass http://cutlist_optimizerapp;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
