---
# Directory and permission setup tasks

- name: Create necessary directories
  file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  with_items:
    - /var/log/cutlist_optimizer
    - /var/backups/cutlist_optimizer
    - /opt/cutlist_optimizer_data
    - /opt/cutlist_optimizer_data/ssl
    - /opt/cutlist_optimizer_data/postgresql/15/main
    - /var/log/nginx
    - /etc/letsencrypt
    - /var/www/html

- name: Set log directory permissions for Docker container
  file:
    path: /var/log/cutlist_optimizer
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0775'
    recurse: yes

- name: Create log file with correct permissions
  file:
    path: /var/log/cutlist_optimizer/cutlist_optimizer.log
    state: touch
    owner: "1000"
    group: "1000"
    mode: '0664'

- name: Set data directory permissions for Docker container
  file:
    path: /opt/cutlist_optimizer_data
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0775'
    recurse: yes

- name: Set PostgreSQL data directory permissions
  file:
    path: /opt/cutlist_optimizer_data/postgresql/15/main
    state: directory
    owner: "999"
    group: "999"
    mode: '0775'
    recurse: yes

- name: Set Nginx log directory permissions
  file:
    path: /var/log/nginx
    state: directory
    owner: "101"
    group: "101"
    mode: '0775'
    recurse: yes

- name: Set backup directory permissions for Docker container
  file:
    path: /var/backups/cutlist_optimizer
    state: directory
    owner: "1000"
    group: "1000"
    mode: '0775'
    recurse: yes
