---
# Verification and testing tasks

- name: Verify network connectivity
  shell: |
    docker exec {{ container_name }} curl -I http://{{ db_container_name }}:5437
  register: curl_result
  changed_when: false
  failed_when: false

- name: Run pytest in test container
  community.docker.docker_container_exec:
    container: "{{ container_name }}"
    command: >
      bash -c "CUTLIST_OPTIMIZER_CONTEXT=test DB_IP={{ db_container_name }}
      POSTGRES_USER={{ env_config.pg_user }} POSTGRES_PASSWORD={{ env_config.pg_password }}
      CUTOPT_DB_NAME={{ env_config.cutopt_db_name }} SECRET_KEY={{ env_config.secret_key }}
      TELEGRAM_BOT_TOKEN={{ env_config.telegram_bot_token }} TELEGRAM_CHAT_ID={{ env_config.telegram_chat_id }}
      ADMIN_USER_USERNAME={{ env_config.admin_user_username }} ADMIN_USER_PASSWORD={{ env_config.admin_user_password }}
      ADMIN_USER_FIRST_NAME={{ env_config.admin_user_first_name }} ADMIN_USER_LAST_NAME={{ env_config.admin_user_last_name }}
      ADMIN_USER_EMAIL={{ env_config.admin_user_email }}
      /opt/env3/cutlist_optimizer/bin/python cutlist_optimizer/tests/run_tests.py"
  register: pytest_result
  when: context == 'test'

- name: Show pytest output
  debug:
    msg: "{{ pytest_result.stdout_lines }}"
  when: context == 'test'

- name: Show pytest errors if any
  debug:
    msg: "{{ pytest_result.stderr_lines }}"
  when: context == 'test' and pytest_result.stderr_lines | length > 0

- name: Fail if tests fail
  fail:
    msg: "Tests failed with exit code {{ pytest_result.rc }}"
  when: context == 'test' and pytest_result.rc != 0 