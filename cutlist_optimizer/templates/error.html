<!doctype html>
{% extends "base.html" %}

{% block body %}
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <div class="error-template">
                <h1>Oops!</h1>
                <h2>{{ error_code }} - {{ error_name }}</h2>
                <div class="error-details">
                    {{ error_description }}
                </div>
                {% if traceback %}
                <div class="card mt-4">
                    <div class="card-header bg-danger text-white">
                        <h3 class="mb-0">Error Details</h3>
                    </div>
                    <div class="card-body">
                        <pre class="traceback">{{ traceback }}</pre>
                    </div>
                </div>
                {% endif %}
                <div class="error-actions mt-4">
                    <a href="/" class="btn btn-primary btn-lg">
                        <i class="fas fa-home"></i> Take Me Home
                    </a>
                    <a href="javascript:history.back()" class="btn btn-secondary btn-lg">
                        <i class="fas fa-arrow-left"></i> Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
