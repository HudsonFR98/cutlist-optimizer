# Project name prefixes containers, volumes, and networks (e.g. cutopt-prod, cutopt-dev).
# Set CUTLIST_OPTIMIZER_CONTEXT in .env (dev, prod, validation, …).
name: "cutopt-${CUTLIST_OPTIMIZER_CONTEXT:-dev}"

services:
  app:
    build: .
    container_name: "cutopt_app_${CUTLIST_OPTIMIZER_CONTEXT:-dev}"
    ports:
      - "8084:8080"
    env_file:
      - .env
    environment:
      # Same value as in .env; default dev if missing (drives lib/_config.py and container names below).
      CUTLIST_OPTIMIZER_CONTEXT: ${CUTLIST_OPTIMIZER_CONTEXT:-dev}
      DB_IP: db
      PATH: /opt/env3/cutlist_optimizer/bin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/cutlist_optimizer:cached
      - ./logs:/var/log/cutlist_optimizer
      - ./backups:/var/backup
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  db:
    image: postgres:15
    container_name: "cutopt_db_${CUTLIST_OPTIMIZER_CONTEXT:-dev}"
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./cutlist_optimizer/tests/reset.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5437:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U web -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: "cutopt_redis_${CUTLIST_OPTIMIZER_CONTEXT:-dev}"
    ports:
      - "6382:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

networks:
  default:
    name: "cutopt_network_${CUTLIST_OPTIMIZER_CONTEXT:-dev}"