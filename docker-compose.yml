# Docker Compose file format version 3.8 for compatibility with Docker Compose 2.35.1
version: '3.8'

services:
  app:
    build: .
    container_name: cutopt_app_dev
    ports:
      - "8084:8080"
    environment:
      - CUTLIST_OPTIMIZER_CONTEXT=dev
      - DB_IP=cutopt_db_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/cutlist_optimizer:cached
      - app_logs:/var/log/cutlist_optimizer
      - ./backups:/var/backup
    restart: always
    networks:
      - cutopt_network_dev

  db:
    image: postgres:15
    container_name: cutopt_db_dev
    environment:
      - POSTGRES_USER=web
      - POSTGRES_PASSWORD=cutopt2025_x
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./cutlist_optimizer/tests/reset.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5437:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U web -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cutopt_network_dev

  redis:
    image: redis:7-alpine
    container_name: cutopt_redis_dev
    ports:
      - "6382:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cutopt_network_dev

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs
networks:
  cutopt_network_dev:
    driver: bridge
