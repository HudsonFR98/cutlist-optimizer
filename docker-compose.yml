services:
  app:
    build: .
    container_name: nsft_app_dev
    ports:
      - "8080:8080"
    environment:
      - NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT=dev
      - DB_IP=nsft_db_dev
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/opt/nath_standalone_flask_template:cached
      - app_logs:/var/log/nath_standalone_flask_template
      - backup_data:/var/backup
    restart: always
    networks:
      - nsft_network_dev

  db:
    image: postgres:15
    container_name: nsft_db_dev
    environment:
      - POSTGRES_USER=web
      - POSTGRES_PASSWORD=nsft2025_x
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    ports:
      - "5433:5432"
    restart: always
    command: postgres -c 'max_connections=100'
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U web -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nsft_network_dev

  redis:
    image: redis:7-alpine
    container_name: nsft_redis_dev
    ports:
      - "6380:6379"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nsft_network_dev

volumes:
  postgres_data:
  app_logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/log/nath_standalone_flask_template
  backup_data:
networks:
  nsft_network_dev:
    driver: bridge
