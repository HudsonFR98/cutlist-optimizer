  when: manual
  environment:
    name: staging
    url: http://serv-nsft-d-01:8080/
  needs:
    - build_docker
    - pytest
  when: manual
  tags:
    - docker-runner

deploy_prod:
  stage: prod
  <<: *ssh_setup_template
  variables:
    SSH_HOST: nath-server.local
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
  script:
