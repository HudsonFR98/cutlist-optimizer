variables:
  NATH_STANDALONE_FLASK_TEMPLATE_CONTEXT: test
  DB_IP: localhost
  PGPASSWORD: nsft2025_x
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

stages:
  - populate-proxy
  - docker
  - test
  - build
  - demo
  - prod

# Reusable job templates
.ssh_setup_template: &ssh_setup_template
  image: python:3.10
  before_script:
    - apt update && apt install -y openssh-client
    - mkdir -p ~/.ssh
    - cp /mnt/ssh/* ~/.ssh/
    - chmod 600 ~/.ssh/id_rsa
    - chmod 644 ~/.ssh/known_hosts
    - ssh-keyscan $SSH_HOST >> ~/.ssh/known_hosts
    - pip install ansible
  tags:
    - docker-runner

populate_dependency_proxy:
  stage: populate-proxy
  image: docker:28.1.1
  services:
    - name: docker:28.1.1-dind
      alias: docker
      command: ["--insecure-registry=nath-server.local:8124"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login $CI_DEPENDENCY_PROXY_SERVER -u $CI_DEPENDENCY_PROXY_USER --password-stdin
  script:
    - echo "Populating dependency proxy with nath used images..."
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:28.1.1-dind
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/postgres:15
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/nginx:alpine
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/redis:7-alpine
    - docker pull ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:latest
    - echo "Dependency proxy population completed!"
  only:
    - master
    - tags
  when: manual
  tags:
    - docker-runner

build_docker:
  stage: docker
  # Option A (requires step 1): keep pulling job image via Dependency Proxy
  image: docker:28.1.1
  services:
    - name: docker:28.1.1-dind
      alias: docker
      command:
        - "--insecure-registry=nath-server.local:8124"
        - "--insecure-registry=nath-server.local:8127"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "http://$CI_REGISTRY"
    - echo "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "http://$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
  script:
    - docker info
    - docker build --build-arg BASE_IMAGE=${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.11-slim -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - master
    - tags
  tags:
    - docker-runner

pytest:
  stage: test
  <<: *ssh_setup_template
  variables:
    SSH_HOST: serv-nsft-t-01
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env test --docker-image $DOCKER_IMAGE --docker-registry $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD --container-registry-server $CI_REGISTRY --dependency-proxy-server $CI_DEPENDENCY_PROXY_SERVER --dependency-proxy-username $CI_DEPENDENCY_PROXY_USER --dependency-proxy-password $CI_DEPENDENCY_PROXY_PASSWORD
  environment:
    name: test
    url: http://serv-nsft-t-01:8080/
  needs:
    - build_docker
  when: manual
  tags:
    - docker-runner

pep8:
  stage: test
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/python:3.10
  script:
    - pip install flake8
    - flake8 nath_standalone_flask_template | tee pep8.out || true
  allow_failure: true
  artifacts:
    paths:
      - pep8.out
    expire_in: 1 week
  when: manual
  tags:
    - docker-runner

deploy_demo:
  stage: demo
  <<: *ssh_setup_template
  variables:
    SSH_HOST: serv-nsft-d-01
    BUILD_DATE: $CI_PIPELINE_CREATED_AT
  script:
    - python3 deploy/ansible_deploy.py --action deploy --env demo --docker-image $DOCKER_IMAGE --docker-registry $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX --registry-username $CI_REGISTRY_USER --registry-password $CI_REGISTRY_PASSWORD --container-registry-server $CI_REGISTRY --dependency-proxy-server $CI_DEPENDENCY_PROXY_SERVER --dependency-proxy-username $CI_DEPENDENCY_PROXY_USER --dependency-proxy-password $CI_DEPENDENCY_PROXY_PASSWORD
  when: manual
  environment:
    name: staging
    url: http://serv-nsft-d-01:8080/
  needs:
    - build_docker
    - pytest
  when: manual
  tags:
    - docker-runner

